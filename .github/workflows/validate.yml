name: Validate scripts

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall academic_toolkit scripts toolkit.py start_gui.py tests
      - name: Validate career catalog
        run: python -c "from academic_toolkit.career_engine import load_careers; d=load_careers(); assert len(d['careers']) >= 7; print('career profiles:', len(d['careers']))"
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Import desktop application
        shell: pwsh
        run: python -c "from academic_toolkit.desktop_app import DesktopApp; print('desktop GUI import OK')"

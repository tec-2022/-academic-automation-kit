name: Nueva automatización
about: Propón un script útil para estudiantes, docentes o investigadores
labels: []
body:
  - type: dropdown
    id: audience
    attributes:
      label: ¿A quién ayudaría?
      options:
        - Estudiantes
        - Docentes
        - Investigadores
        - A todos
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema repetitivo
      description: Describe la tarea manual que quieres automatizar.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: ¿Qué debería recibir o ver el usuario al terminar?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Datos y privacidad
      description: Indica si trabajaría con nombres, matrículas, calificaciones u otros datos sensibles.
